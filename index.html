<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚖️ Società & Licenze di Arcamis</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>⚖️ Società &amp; Licenze di Arcamis ⚖️</h1>
  <p>Imprese · Società · Patenti · Camera del Commercio — Arcadia</p>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Cambia tema">🌙</button>
</header>

<div class="tabs" id="tabs">
  <div class="tabs-row" id="tabsRow"></div>
  <div class="tabs-row" id="searchRow" style="padding: 8px 20px 12px; border-top: 1px solid var(--border); display: none;">
    <div class="search-wrap">
      <input type="search" class="search-input" id="globalSearch" placeholder="🔍 Cerca in tutto il documento..." aria-label="Ricerca globale">
    </div>
    <div id="activeFilters" style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center;"></div>
  </div>
</div>

<div class="mobile-drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="mobile-drawer" id="mobileDrawer">
  <div class="mobile-drawer-header">
    <h3>📑 Navigazione</h3>
    <button class="mobile-drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <nav id="mobileDrawerNav"></nav>
</div>
<button class="mobile-nav-btn" id="mobileNavBtn" onclick="openDrawer()" title="Navigazione">☰</button>

<!-- ══════ MODAL OVERLAY ══════ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <h3 id="modalTitle">Strumento</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<div class="main">
  <nav class="sidenav" id="sidenav"></nav>
  <div class="content" id="content"></div>
</div>

<script src="data.js"></script>
<script src="gestore.js"></script>
<script src="app.js"></script>
</body>
</html>
